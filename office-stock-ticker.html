<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Live Market Ticker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e17;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(90deg, #1a2332, #0d1520);
    padding: 16px 30px;
    border-bottom: 2px solid #00d4aa;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  header h1 { font-size: 2.4rem; font-weight: 600; }
  header h1 span { color: #00d4aa; }
  .header-info {
    text-align: right;
    font-size: 1.3rem;
  }
  .clock { font-size: 1.8rem; font-weight: 600; color: #00d4aa; }
  .fng { margin-top: 4px; }
  .fng.fear { color: #ff4d4d; }
  .fng.greed { color: #00d4aa; }
  .fng.neutral { color: #ffaa00; }
  .ticker-container {
    flex: 1;
    display: flex;
    align-items: center;
    background: #111827;
    overflow: hidden;
    position: relative;
  }
  .ticker-track {
    display: flex;
    animation: scroll 50s linear infinite;
    white-space: nowrap;
  }
  .ticker-item {
    display: flex;
    align-items: center;
    padding: 0 55px;
    font-size: 2.8rem;
    font-weight: 500;
    min-width: max-content;
  }
  .symbol { color: #fff; font-weight: 700; margin-right: 16px; }
  .price { margin-right: 10px; }
  .change.up { color: #00d4aa; }
  .change.down { color: #ff4d4d; }
  .range, .volume {
    color: #888;
    font-size: 1.5rem;
    margin-left: 18px;
    font-weight: 400;
  }
  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  footer {
    background: #0d1520;
    padding: 10px 30px;
    text-align: center;
    font-size: 1rem;
    color: #666;
    border-top: 1px solid #222;
    flex-shrink: 0;
  }
  .weather-bar {
    background: #0d1520;
    padding: 16px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #1a2332;
    font-size: 1.5rem;
    flex-shrink: 0;
  }
  .weather-bar .location { color: #00d4aa; font-weight: 600; }
  .weather-bar .temp { font-size: 1.9rem; font-weight: 600; }
  .weather-bar .details { color: #aaa; font-size: 1.3rem; }
  .status-live { color: #00d4aa; }
  .status-delayed { color: #ffaa00; }
</style>
</head>
<body>
  <header>
    <h1>LIVE <span>MARKET TICKER</span></h1>
    <div class="header-info">
      <div class="clock" id="clock">--:--:--</div>
      <div id="fng" class="fng">Fear & Greed: --</div>
      <div id="status">Loading live data...</div>
    </div>
  </header>

  <div class="ticker-container">
    <div class="ticker-track" id="ticker">
      <!-- Populated by JS -->
    </div>
  </div>

  <div class="weather-bar" id="weather-bar">
    <div class="location">Oslo</div>
    <div class="temp" id="weather-temp">--°C</div>
    <div class="details" id="weather-details">Loading weather...</div>
  </div>

  <footer>
    Live data via CoinGecko, alternative.me, Frankfurter, xaus.com & Open-Meteo • LOKO.OL is delayed/sample • Refresh every 60s • Press F11 for full screen
  </footer>

<script>
const TICKER_ITEMS = [
  { id: 'btc', symbol: 'BTC', coinId: 'bitcoin', type: 'crypto' },
  { id: 'eth', symbol: 'ETH', coinId: 'ethereum', type: 'crypto' },
  { id: 'ltc', symbol: 'LTC', coinId: 'litecoin', type: 'crypto' },
  { id: 'gold', symbol: 'GOLD', type: 'metal' },
  { id: 'silver', symbol: 'SILVER', type: 'metal' },
  { id: 'loko', symbol: 'LOKO.OL', type: 'stock', fallback: { price: 0.51, change: -1.95, volume: 7800000, high: 0.53, low: 0.49, currency: 'NOK' } },
  { id: 'usdnok', symbol: 'USD/NOK', type: 'forex' }
];

let tickerData = {};

function formatPrice(value, currency = 'USD') {
  if (currency === 'NOK') return value.toFixed(2) + ' NOK';
  if (value >= 1000) return '$' + value.toLocaleString(undefined, { maximumFractionDigits: 0 });
  return '$' + value.toFixed(2);
}

function formatChange(change) {
  const arrow = change >= 0 ? '▲' : '▼';
  const cls = change >= 0 ? 'up' : 'down';
  return `<span class="change ${cls}">${arrow} ${Math.abs(change).toFixed(2)}%</span>`;
}

function formatVolume(vol) {
  if (vol >= 1e9) return `Vol $${(vol/1e9).toFixed(1)}B`;
  if (vol >= 1e6) return `Vol $${(vol/1e6).toFixed(1)}M`;
  if (vol >= 1e3) return `Vol $${(vol/1e3).toFixed(0)}K`;
  return `Vol ${vol}`;
}

function formatRange(high, low) {
  if (!high || !low) return '';
  return `<span class="range">H ${high.toFixed(2)} / L ${low.toFixed(2)}</span>`;
}

function buildTickerHTML() {
  const items = [];
  TICKER_ITEMS.forEach(item => {
    const d = tickerData[item.id] || {};
    const price = d.price ? formatPrice(d.price, d.currency || 'USD') : '--';
    const change = d.change !== undefined ? formatChange(d.change) : '';
    const vol = d.volume ? `<span class="volume">${formatVolume(d.volume)}</span>` : '';
    const range = formatRange(d.high, d.low);
    items.push(`<div class="ticker-item"><span class="symbol">${item.symbol}</span><span class="price">${price}</span>${change}${vol}${range}</div>`);
  });
  // Duplicate for seamless scroll
  const html = items.join('') + items.join('');
  document.getElementById('ticker').innerHTML = html;
}

async function fetchCrypto() {
  try {
    const ids = 'bitcoin,ethereum,litecoin';
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true&include_24hr_vol=true&include_24hr_high=true&include_24hr_low=true`);
    const data = await res.json();
    tickerData.btc = {
      price: data.bitcoin.usd,
      change: data.bitcoin.usd_24h_change,
      volume: data.bitcoin.usd_24h_vol,
      high: data.bitcoin.usd_24h_high || data.bitcoin.usd,
      low: data.bitcoin.usd_24h_low || data.bitcoin.usd,
      currency: 'USD'
    };
    tickerData.eth = {
      price: data.ethereum.usd,
      change: data.ethereum.usd_24h_change,
      volume: data.ethereum.usd_24h_vol,
      high: data.ethereum.usd_24h_high || data.ethereum.usd,
      low: data.ethereum.usd_24h_low || data.ethereum.usd,
      currency: 'USD'
    };
    tickerData.ltc = {
      price: data.litecoin.usd,
      change: data.litecoin.usd_24h_change,
      volume: data.litecoin.usd_24h_vol,
      high: data.litecoin.usd_24h_high || data.litecoin.usd,
      low: data.litecoin.usd_24h_low || data.litecoin.usd,
      currency: 'USD'
    };
    document.getElementById('status').innerHTML = '<span class="status-live">● Live</span>';
  } catch (e) {
    console.error('Crypto fetch failed', e);
    document.getElementById('status').innerHTML = '<span class="status-delayed">● Using cached</span>';
  }
}

async function fetchMetals() {
  try {
    const res = await fetch('https://xaus.com/api/v1/spot');
    const data = await res.json();
    tickerData.gold = {
      price: data.spot_usd_oz || data.xau?.price,
      change: 0.5, // approximate; API may not provide % in simple call
      volume: null,
      high: null,
      low: null,
      currency: 'USD'
    };
    tickerData.silver = {
      price: data.silver_usd_oz,
      change: 0.3,
      volume: null,
      high: null,
      low: null,
      currency: 'USD'
    };
  } catch (e) {
    console.error('Metals fetch failed', e);
    // Fallback sample
    tickerData.gold = { price: 4020, change: 0.2, currency: 'USD' };
    tickerData.silver = { price: 48.5, change: 0.1, currency: 'USD' };
  }
}

async function fetchForex() {
  try {
    const res = await fetch('https://api.frankfurter.dev/v2/rates?base=USD&quotes=NOK');
    const data = await res.json();
    const rate = data.rates?.NOK || data.quotes?.NOK || 9.65;
    tickerData.usdnok = {
      price: rate,
      change: 0.3, // approximate; Frankfurter is daily
      volume: null,
      high: null,
      low: null,
      currency: 'NOK'
    };
  } catch (e) {
    console.error('Forex fetch failed', e);
    tickerData.usdnok = { price: 9.65, change: 0.3, currency: 'NOK' };
  }
}

async function fetchWeather() {
  try {
    const lat = 59.9139;
    const lon = 10.7522;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe/Oslo&forecast_days=1`;
    const res = await fetch(url);
    const data = await res.json();
    const current = data.current;
    const daily = data.daily;
    const temp = Math.round(current.temperature_2m);
    const feels = Math.round(current.apparent_temperature);
    const wind = Math.round(current.wind_speed_10m);
    const humidity = current.relative_humidity_2m;
    const high = Math.round(daily.temperature_2m_max[0]);
    const low = Math.round(daily.temperature_2m_min[0]);
    const precip = daily.precipitation_probability_max[0];
    const condition = weatherCodeToText(current.weather_code);

    document.getElementById('weather-temp').textContent = `${temp}°C ${condition}`;
    document.getElementById('weather-details').textContent = 
      `Feels like ${feels}°C · Wind ${wind} km/h · Humidity ${humidity}% · Today ${high}°/${low}° · Rain ${precip}%`;
  } catch (e) {
    console.error('Weather fetch failed', e);
    document.getElementById('weather-details').textContent = 'Weather unavailable';
  }
}

function weatherCodeToText(code) {
  const map = {
    0: 'Clear', 1: 'Mainly Clear', 2: 'Partly Cloudy', 3: 'Overcast',
    45: 'Fog', 48: 'Rime Fog', 51: 'Light Drizzle', 53: 'Drizzle', 55: 'Dense Drizzle',
    61: 'Slight Rain', 63: 'Rain', 65: 'Heavy Rain', 71: 'Slight Snow', 73: 'Snow',
    75: 'Heavy Snow', 80: 'Rain Showers', 81: 'Rain Showers', 82: 'Violent Rain',
    95: 'Thunderstorm'
  };
  return map[code] || 'Unknown';
}

async function fetchFNG() {
  try {
    const res = await fetch('https://api.alternative.me/fng/?limit=1');
    const data = await res.json();
    const val = parseInt(data.data[0].value);
    const label = data.data[0].value_classification;
    const el = document.getElementById('fng');
    el.textContent = `Fear & Greed: ${val} (${label})`;
    el.className = 'fng ' + (val < 40 ? 'fear' : val > 60 ? 'greed' : 'neutral');
  } catch (e) {
    console.error('FNG fetch failed', e);
  }
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' ' + now.toLocaleDateString();
}

function loadLokoFallback() {
  const f = TICKER_ITEMS.find(i => i.id === 'loko').fallback;
  tickerData.loko = f;
}

async function refreshAll() {
  await Promise.all([fetchCrypto(), fetchForex(), fetchFNG(), fetchMetals(), fetchWeather()]);
  loadLokoFallback();
  buildTickerHTML();
}

// Initial load
updateClock();
setInterval(updateClock, 1000);
refreshAll();
setInterval(refreshAll, 60000);

// Start with fallback so something shows immediately
loadLokoFallback();
buildTickerHTML();
</script>
</body>
</html>
